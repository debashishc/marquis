# Query-expansion LLM (decomposes queries into searchable sub-queries).
backend: causal_lm
model: ${oc.env:MARQUIS_RETRIEVAL_MODEL,Qwen/Qwen3.5-2B}
cache_dir: ${oc.env:HF_HOME,null}

# OmniEmbed dense video retriever (retrieve command).
embedder:
  model: Qwen/Qwen2.5-Omni-7B
  adapter: Tevatron/OmniEmbed-v0.1
  whisper: medium.en
  cache_dir: ${oc.env:HF_HOME,null}
